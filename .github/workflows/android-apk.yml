name: AstroMatch Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - astromatch-roadmap-v2
      - test/onboarding-point-1

permissions:
  contents: read

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: gradle

      - name: Install dependencies
        run: npm ci

      - name: Build AstroMatch runtime
        run: npm run build:runtime

      - name: Build mobile web
        run: npm run build:mobile-web

      - name: Run tests
        run: npm test

      - name: Sync Capacitor Android
        run: npx cap sync android

      - name: Configure isolated test app
        if: github.ref == 'refs/heads/test/onboarding-point-1'
        run: |
          python3 - <<'PYTEST'
          from pathlib import Path
          p = Path('android/app/build.gradle')
          p.write_text(p.read_text().replace('applicationId "com.astromatch.app"', 'applicationId "com.astromatch.app.onboarding"'))
          p = Path('android/app/src/main/res/values/strings.xml')
          p.write_text(p.read_text().replace('>AstroMatch<', '>AstroMatch Test<'))
          PYTEST

      - name: Build debug APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: AstroMatch-debug
          path: android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 14
