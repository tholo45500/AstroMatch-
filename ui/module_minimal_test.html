<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<title>AstroMatch Module Test</title>
<style>
body {
  background:#111;
  color:white;
  font-family:monospace;
  padding:20px;
}
#minimalResult {
  border:3px solid lime;
  padding:20px;
  color:lime;
  font-size:18px;
}
</style>
</head>

<body>

<h2>ASTROMATCH MODULE EXTERNE</h2>

<div id="minimalResult">
MODULE NON EXECUTE POUR LE MOMENT
</div>

<script>
window.addEventListener("error", function(e) {
  document.getElementById("minimalResult").textContent =
    "ERREUR : " +
    e.message +
    "\nligne=" +
    e.lineno +
    "\ncolonne=" +
    e.colno;
});

window.addEventListener("unhandledrejection", function(e) {
  document.getElementById("minimalResult").textContent =
    "PROMISE ERROR : " + e.reason;
});
</script>

<script type="module" src="./module_minimal_test.js"></script>

</body>
</html>
