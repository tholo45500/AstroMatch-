<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>AstroMatch Module Probe</title>
</head>

<body>

<pre id="probe">MODULE PROBE — démarrage...</pre>

<script>
(function () {
  const box = document.getElementById("probe");

  function log(title, value) {
    box.textContent +=
      "\n\n===== " + title + " =====\n" +
      String(value);
  }

  window.addEventListener("error", function (e) {
    log(
      "JAVASCRIPT ERROR",
      "message=" + e.message +
      "\nfile=" + e.filename +
      "\nline=" + e.lineno +
      "\ncolumn=" + e.colno +
      "\nstack=" + (e.error?.stack || "")
    );
  });

  window.addEventListener("unhandledrejection", function (e) {
    log(
      "PROMISE ERROR",
      e.reason?.stack || e.reason || "Unknown rejection"
    );
  });

  window.__probeLog = log;

  log("CLASSIC SCRIPT", "OK — avant module");
})();
</script>

<script type="module">
window.__probeLog(
  "MODULE ENTER",
  "Le module est bien exécuté."
);
</script>

</body>
</html>
