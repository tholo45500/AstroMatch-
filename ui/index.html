<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>AstroMatch</title>
</head>
<body>
<script>
(() => {
  try {
    const raw =
      localStorage.getItem("astromatch:profiles");

    const profiles =
      raw ? JSON.parse(raw) : [];

    const primary =
      Array.isArray(profiles)
        ? profiles.find(profile =>
            profile &&
            profile.role === "primary" &&
            profile.profile_id &&
            (
              profile.identity?.first_name ||
              profile.first_name
            )
          )
        : null;

    if (!primary) {
      localStorage.removeItem(
        "astromatch:profiles"
      );

      location.replace(
        "./profile_setup.html"
      );

      return;
    }

    location.replace(
      "./match_result.html"
    );

  } catch {
    localStorage.removeItem(
      "astromatch:profiles"
    );

    location.replace(
      "./profile_setup.html"
    );
  }
})();
</script>
</body>
</html>
