  <circle cx="210" cy="160" r="1.5"/>
  <circle cx="350" cy="80" r="2"/>
  <circle cx="540" cy="145" r="1.4"/>
  <circle cx="650" cy="75" r="2"/>
  <circle cx="835" cy="115" r="1.6"/>

  <circle cx="120" cy="330" r="1.5"/>
  <circle cx="290" cy="270" r="2"/>
  <circle cx="470" cy="360" r="1.5"/>
  <circle cx="590" cy="300" r="2"/>
  <circle cx="830" cy="360" r="1.7"/>

  <circle cx="70" cy="700" r="2"/>
  <circle cx="250" cy="620" r="1.5"/>
  <circle cx="420" cy="760" r="2"/>
  <circle cx="630" cy="650" r="1.5"/>
  <circle cx="815" cy="720" r="2"/>

  <circle cx="110" cy="1040" r="1.8"/>
  <circle cx="330" cy="970" r="1.5"/>
  <circle cx="520" cy="1090" r="2"/>
  <circle cx="750" cy="1010" r="1.5"/>

  <circle cx="75" cy="1370" r="2"/>
  <circle cx="230" cy="1280" r="1.4"/>
  <circle cx="450" cy="1390" r="2"/>
  <circle cx="680" cy="1320" r="1.5"/>
  <circle cx="845" cy="1440" r="2"/>

  <circle cx="160" cy="1660" r="1.5"/>
  <circle cx="410" cy="1590" r="2"/>
  <circle cx="620" cy="1700" r="1.5"/>
  <circle cx="810" cy="1620" r="2"/>

</g>

<!-- petites étoiles violettes -->
<g fill="#c084fc" opacity=".9">

  <circle cx="150" cy="220" r="1.2"/>
  <circle cx="390" cy="230" r="1"/>
  <circle cx="510" cy="200" r="1.3"/>
  <circle cx="845" cy="270" r="1"/>

  <circle cx="180" cy="480" r="1.3"/>
  <circle cx="360" cy="520" r="1"/>
  <circle cx="700" cy="500" r="1.4"/>

  <circle cx="130" cy="860" r="1"/>
