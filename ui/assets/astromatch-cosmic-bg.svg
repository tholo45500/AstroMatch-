<svg xmlns="http://www.w3.org/2000/svg"
viewBox="0 0 900 1800" preserveAspectRatio="xMidYMid slice">

<defs>

  <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="#080b2c"/>
    <stop offset=".32" stop-color="#11113a"/>
    <stop offset=".62" stop-color="#080c28"/>
    <stop offset="1" stop-color="#030817"/>
  </linearGradient>

  <radialGradient id="purpleGlow">
    <stop offset="0" stop-color="#a855f7" stop-opacity=".75"/>
    <stop offset=".45" stop-color="#7c3aed" stop-opacity=".25"/>
    <stop offset="1" stop-color="#7c3aed" stop-opacity="0"/>
  </radialGradient>

  <radialGradient id="blueGlow">
    <stop offset="0" stop-color="#38bdf8" stop-opacity=".45"/>
    <stop offset=".5" stop-color="#2563eb" stop-opacity=".18"/>
    <stop offset="1" stop-color="#2563eb" stop-opacity="0"/>
  </radialGradient>

  <radialGradient id="moon">
    <stop offset="0" stop-color="#ffd6f6"/>
    <stop offset=".55" stop-color="#c084fc"/>
    <stop offset="1" stop-color="#7c3aed"/>
  </radialGradient>

  <filter id="blur">
    <feGaussianBlur stdDeviation="45"/>
  </filter>

  <filter id="soft">
    <feGaussianBlur stdDeviation="12"/>
  </filter>

</defs>

<!-- ciel -->
<rect width="900" height="1800" fill="url(#sky)"/>

<!-- nébuleuses -->
<ellipse
  cx="760" cy="210"
  rx="360" ry="280"
  fill="url(#purpleGlow)"
  filter="url(#blur)"
/>

<ellipse
  cx="100" cy="580"
  rx="320" ry="420"
  fill="url(#blueGlow)"
  filter="url(#blur)"
/>

<ellipse
  cx="820" cy="1220"
  rx="420" ry="360"
  fill="url(#purpleGlow)"
  opacity=".65"
  filter="url(#blur)"
/>

<ellipse
  cx="200" cy="1550"
  rx="430" ry="300"
  fill="url(#blueGlow)"
  opacity=".5"
  filter="url(#blur)"
/>

<!-- halo lune -->
<circle
  cx="735" cy="205"
  r="155"
  fill="#a855f7"
  opacity=".18"
  filter="url(#blur)"
/>

<!-- lune -->
<circle
  cx="735" cy="205"
  r="72"
  fill="url(#moon)"
/>

<circle
  cx="760" cy="185"
  r="72"
  fill="#0b1030"
/>

<!-- étoiles grandes -->
<g fill="#fff">

