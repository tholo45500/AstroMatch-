  <circle cx="790" cy="1150" r="1.4"/>

  <circle cx="310" cy="1500" r="1.2"/>
  <circle cx="720" cy="1530" r="1.4"/>

</g>

<!-- étoiles avec croix -->
<g stroke="#fff" stroke-linecap="round">

  <g transform="translate(565 215)">
    <path d="M0 -15 V15" opacity=".85"/>
    <path d="M-15 0 H15" opacity=".65"/>
  </g>

  <g transform="translate(150 390)">
    <path d="M0 -12 V12" opacity=".8"/>
    <path d="M-12 0 H12" opacity=".6"/>
  </g>

  <g transform="translate(770 610)">
    <path d="M0 -14 V14" opacity=".85"/>
    <path d="M-14 0 H14" opacity=".6"/>
  </g>

  <g transform="translate(110 1220)">
    <path d="M0 -14 V14" opacity=".8"/>
    <path d="M-14 0 H14" opacity=".6"/>
  </g>

  <g transform="translate(700 1500)">
    <path d="M0 -13 V13" opacity=".8"/>
    <path d="M-13 0 H13" opacity=".6"/>
  </g>

</g>

<!-- étoile filante -->
<path
  d="M560 110 L675 40"
  stroke="#c4b5fd"
  stroke-width="2"
  opacity=".7"
/>

<path
  d="M565 112 L645 63"
  stroke="#fff"
  stroke-width="1"
  opacity=".55"
/>

