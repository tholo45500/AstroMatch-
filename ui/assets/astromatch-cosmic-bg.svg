<!-- horizon violet -->
<ellipse
  cx="450" cy="450"
  rx="420" ry="55"
  fill="#a855f7"
  opacity=".10"
  filter="url(#soft)"
/>

<!-- vignette -->
<rect
  width="900"
  height="1800"
  fill="none"
  stroke="#020617"
  stroke-width="90"
  opacity=".35"
/>

</svg>
